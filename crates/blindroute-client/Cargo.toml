[package]
name = "blindroute-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BlindRoute native client SDK — encrypt, decrypt, and communicate with FHE servers"
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
blindroute-core.workspace = true
blindroute-ckks.workspace = true
blindroute-bfv.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
