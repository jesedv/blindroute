    <noscript>
      <h1>BlindRoute — Zero-Trust FHE API Middleware</h1>
      <p>
        BlindRoute wraps any arithmetic API in Fully Homomorphic Encryption so the
        server computes on encrypted data without ever decrypting it. Dual-scheme
        CKKS + BFV. GPU-accelerated. Browser-native WASM. MIT licensed.
      </p>
      <ul>
        <li>CKKS: Real-number homomorphic encryption — encode, encrypt, add, multiply, rescale</li>
        <li>BFV: Integer homomorphic encryption — encode, encrypt, add</li>
        <li>GPU NTT via wgpu (Vulkan, Metal, DX12, WebGPU)</li>
        <li>WASM demo: live in-browser FHE calculator</li>
        <li>circuit! DSL: declarative arithmetic circuit definition</li>
      </ul>
      <p>
        Source: <a href="https://github.com/jesedv/blindroute">github.com/jesedv/blindroute</a>
