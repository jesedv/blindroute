  <body>
    <noscript>
      <h1>BlindRoute — Fully Homomorphic Encryption on GPU</h1>
      <p>
        BlindRoute computes on encrypted data without ever decrypting it: a free, open-source,
        browser-native engine (RLWE / CKKS / BFV-style ring Z_q[x]/(x^N+1)) built on an NTT /
        INTT core with a threshold secret-sharing "private mean" demo. Runs on any GPU vendor
        and in the browser via WASM.
      </p>
      <ul>
        <li>NTT / INTT over Z_q with 32-bit-emulated 64-bit modular arithmetic.</li>
        <li>RLWE negacyclic polynomial multiply mod x^N+1.</li>
        <li>Threshold secret sharing: compute a mean from N parties revealing nothing.</li>
        <li>WASM build verified live, in your browser.</li>
      </ul>
      <p>
        Source: <a href="https://github.com/jesedv/blindroute">github.com/jesedv/blindroute</a>
      </p>
    </noscript>
